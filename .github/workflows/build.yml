name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      # Fake host and temp files only: no DiskPart, no wsl.exe. Exit code = number of failed tests.
      - name: Unit tests
        shell: cmd
        run: bin\wslim-tests.exe

      # Real DiskPart on throw-away VHDX files in the runner's temp folder (the runner is elevated).
      # Never runs wsl.exe and never touches a WSL distro.
      - name: Integration tests (disposable VHDX)
        shell: cmd
        run: bin\wslim-tests.exe --integration "%RUNNER_TEMP%\wslim-it"

      - uses: actions/upload-artifact@v4
        with:
          name: wslim
          path: |
            bin/wslim.exe
            bin/wslim-cli.exe

      - name: Zip for winget and Scoop
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path bin/wslim.exe, bin/wslim-cli.exe -DestinationPath "bin/wslim-$v-win-x64.zip"
          (Get-FileHash "bin/wslim-$v-win-x64.zip" -Algorithm SHA256).Hash

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/wslim.exe
            bin/wslim-cli.exe
            bin/wslim-*-win-x64.zip

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: sh -n src/agent.sh

      - name: shellcheck
        run: shellcheck -s sh -S warning src/agent.sh
